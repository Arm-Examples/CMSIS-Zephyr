name: Build all variants

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}.${{ matrix.build-type }}+${{ matrix.target }} / ${{ matrix.solution.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution:
          - file: zephyr-gcc.csolution.yml
            compiler: GCC
          - file: zephyr-ac6.csolution.yml
            compiler: AC6
        project:
          - blinky
          - threads
        build-type:
          - Debug
          - Debug-RTT
          - Release
        target:
          - B-L475-IOT01A
          - B-U585I-IOT02A
          - STM32H7B3I-DK
          - IFX_T2G_B_H
          - NUCLEO-H563ZI
        exclude:
          # Zephyr 4.4 does not enable SEGGER RTT for this board.
          - build-type: Debug-RTT
            target: IFX_T2G_B_H

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up CMSIS build tools
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ./vcpkg-configuration.json
          cache: cmsis-tools-${{ runner.os }}-${{ hashFiles('vcpkg-configuration.json') }}

      - name: Set up Zephyr
        shell: bash
        run: |
          python -m pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr.git --mr v4.4.0 zephyrproject
          cd zephyrproject
          west update
          python -m pip install -r zephyr/scripts/requirements.txt

      - name: Activate Arm Compiler license
        if: matrix.solution.compiler == 'AC6'
        uses: ARM-software/cmsis-actions/armlm@v1

      - name: Build
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
        run: >-
          cbuild ${{ matrix.solution.file }}
          --packs
          --context "${{ matrix.project }}.${{ matrix.build-type }}+${{ matrix.target }}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-${{ matrix.build-type }}-${{ matrix.target }}-${{ matrix.solution.compiler }}
          path: out
          include-hidden-files: true
